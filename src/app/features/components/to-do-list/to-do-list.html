@if (items.length > 0) {
  <ul>
    @for (item of items; track item.id) {
      <li>
        <input type="checkbox" />
        {{ item.name }}
      </li>
    }
  </ul>
} @else {
  <h1>No items</h1>
  <button (click)="cargarDatos()">Actualizar</button>
  <p>{{ error }}</p>
}
<p-button
  (onClick)="information()"
  label="Información"
  severity="contrast"
  variant="text"
></p-button
><br />
<p-button (onClick)="confirmMSG()" label="Mensaje" severity="success" rounded="true"></p-button>
