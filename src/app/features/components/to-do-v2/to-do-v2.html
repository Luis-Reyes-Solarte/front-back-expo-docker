<div class="card">
  @if (items.length > 0) {
    <p-table
      [value]="items"
      [showGridlines]="isShowGridlines"
      [paginator]="isPaginator"
      [rows]="rows"
      [rowsPerPageOptions]="rowsPerPageOptions"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Done</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td>
            <input type="checkbox" [checked]="item.done" disabled />
          </td>
          <td>
            <p-button severity="info"></p-button>
            <p-button severity="success"></p-button>
            <p-button severity="danger"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  } @else {
    <h1>No items</h1>
  }
</div>
<p-button (onClick)="cargarDatos()" label="Actualizar" severity="success"></p-button>
