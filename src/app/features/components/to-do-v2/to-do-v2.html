<div class="card">
  @if (items.length > 0) {
    <p-table
      [value]="items"
      [showGridlines]="isShowGridlines"
      [paginator]="isPaginator"
      [rows]="rows"
      [rowsPerPageOptions]="rowsPerPageOptions"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Done</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td>
            <input type="checkbox" [checked]="item.done" disabled />
          </td>
          <td class="actions">
            <p-button severity="info" icon="pi pi-eye" label="Ver" (onClick)="ver(item)"></p-button>
            <p-button
              severity="success"
              icon="pi pi-pencil"
              label="Editar"
              (onClick)="editar(item)"
            ></p-button>
            <p-button severity="danger" icon="pi pi-trash" label="Eliminar"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  } @else {
    <h1>No items</h1>
  }
</div>
<p-button (onClick)="cargarDatos()" label="Actualizar" severity="success"></p-button>

<p-dialog [header]="tipoModal" [(visible)]="dialogVisible" position="top">
  <label for="name">Nombre: </label>
  <input
    type="text"
    id="name"
    name="name"
    [disabled]="tipoModal === 'Vista previa'"
    [(ngModel)]="elementoSeleccionado.name"
  />
  <br />
  <label for="done">Done: </label>
  <input
    type="checkbox"
    id="done"
    name="done"
    [disabled]="tipoModal === 'Vista previa'"
    [(ngModel)]="elementoSeleccionado.done"
  />
  <br />
  <p-button severity="success" label="Aceptar" (onClick)="guardarOCerrar()"></p-button>
  <p-button severity="danger" label="Cancelar" (click)="dialogVisible = false"></p-button>
</p-dialog>
